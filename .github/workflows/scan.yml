name: USDT P2P Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          CAPITAL_INR: "50000"
        run: |
          python scanner.py --capital "$CAPITAL_INR" | tee scan_output.txt

      - name: Send Telegram alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python send_telegram.py
          else
            echo "Telegram secrets not configured; skipping alert."
          fi

      - name: Save history
        if: always()
        run: |
          git config user.name "p2p-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p2p_snapshots.csv || true
          git diff --cached --quiet || git commit -m "Update P2P scan history"
          git push || true
